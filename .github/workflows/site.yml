# Site only: rebuild and publish the pages when the design or the site code changes.
# The daily collection publishes the site too, after each new fixing. This workflow
# never touches the ledger.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/compeu/site.py"
      - "src/compeu/dc.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Check the ledger
        run: uv run compeu verify
      - name: Build the site
        run: uv run compeu build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
