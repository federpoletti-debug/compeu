# Every push and pull request: style, tests, and the append-only check against main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Ledger integrity
        run: uv run ceresio verify
      - name: Ledger is append-only versus the base branch
        if: github.event_name == 'pull_request'
        run: uv run ceresio verify --against "origin/${{ github.base_ref }}"
      - name: Ledger is append-only versus the previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: uv run ceresio verify --against "${{ github.event.before }}"
