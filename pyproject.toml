[project]
name = "compeu"
version = "0.1.0"
description = "CompEU: the price of European sovereign GPU compute, collected daily from public provider sources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Code: MIT. Data: CC BY 4.0" }
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "truststore>=0.10",
]

[project.scripts]
compeu = "compeu.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compeu"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
