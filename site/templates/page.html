<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="theme-color" content="#07080B">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CompEU">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ base_url }}static/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ prefix }}static/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{ prefix }}static/fonts/bodoni-moda-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ prefix }}static/fonts/geist-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
{% if hero %}
<link rel="preload" as="image" href="{{ hero.href }}" imagesrcset="{{ hero.srcset }}" imagesizes="{{ hero.sizes }}" fetchpriority="high">
{% endif %}
<link rel="stylesheet" href="{{ prefix }}static/css/fonts.css">
<style>
{{ style | safe }}
</style>
</head>
<body>
<div id="app"></div>
<noscript>
<div style="max-width: 760px; margin: 0 auto; padding: 48px 20px; font-family: Georgia, serif; color: #EEE8DC; background: #07080B; line-height: 1.6">
<p style="font-size: 26px; margin: 0 0 8px">CompEU</p>
<h1 style="font-size: 30px; margin: 0 0 12px">{{ title }}</h1>
<p>{{ description }}</p>
<table style="border-collapse: collapse; width: 100%; margin: 24px 0; font-family: Arial, sans-serif; font-size: 15px">
<caption style="text-align: left; padding-bottom: 8px">Fixings of {{ live.boards[0].d if live.boards else live.asOf }}, euro per GPU-hour</caption>
<thead><tr><th style="text-align: left; border-bottom: 1px solid #3B4153; padding: 6px">Index</th><th style="text-align: left; border-bottom: 1px solid #3B4153; padding: 6px">Name</th><th style="text-align: right; border-bottom: 1px solid #3B4153; padding: 6px">Fixing</th></tr></thead>
<tbody>
{% for b in live.boards %}
<tr><td style="padding: 6px">{{ b.id }}</td><td style="padding: 6px">{{ b.n }}</td><td style="padding: 6px; text-align: right">{{ "€%.4f" | format(b.v) if b.v is not none else "no fixing" }}</td></tr>
{% endfor %}
</tbody>
</table>
<p><a href="{{ pages['Main.dc.html'] }}">Home</a> · <a href="{{ pages['Index.dc.html'] }}">The index</a> · <a href="{{ pages['Why.dc.html'] }}">Why sovereignty</a> · <a href="{{ pages['Methodology.dc.html'] }}">Method</a> · <a href="{{ prefix }}data/latest.json">Data (JSON)</a> · <a href="{{ prefix }}data/fixings.csv">Fixings (CSV)</a></p>
<p>This site draws its pages with JavaScript. The data above is complete without it.</p>
</div>
</noscript>
<script src="{{ prefix }}static/vendor/preact.min.js"></script>
<script src="{{ prefix }}static/js/dcrun.js"></script>
<script type="application/json" id="dc-template">{{ template_json | safe }}</script>
<script>
window.__dcLogic = function (DCLogic, StreamableLogic, React) {
{{ logic | safe }}
;return Component;
};
dcrun.mount(document.getElementById("app"), document.getElementById("dc-template"), window.__dcLogic, {{ pages_json | safe }});
</script>
</body>
</html>
