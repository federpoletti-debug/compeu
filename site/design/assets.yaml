# Files uploaded to the Claude Design canvas (/_blob/<id> in the artboards) and the
# files that replace them on the site, under site/static/. The build swaps each
# /_blob/ address for `file`; images also get a srcset for small screens.
# loading: lazy for pictures below the first screen, eager + high priority for a
# picture at the top of its page (it is also preloaded).

# Europe as dots, for the map (Natural Earth, public domain)
062d75ea86a55d625e48e76e255d0526: {file: geo/europe-dots.json}
# Statues as point clouds, from public 3D scans: the Venus de Milo cast at the SMK
# Copenhagen (public domain) and the Augustus of the Musée Saint-Raymond (CC0)
59dee99bdc77f4b782436efb1ce53cf0: {file: 3d/venus-points.json}
01c8be1bdc8194a88edbfa46df1efb36: {file: 3d/augustus-points.json}
# Engravings redrawn in gold on black (public domain, BnF)
0f13af6914d683e6924be5e440156364:
  file: img/library-night-2200.webp
  srcset: [img/library-night-1200.webp 1200w, img/library-night-2200.webp 2200w]
  sizes: "100vw"
  loading: lazy
101df7df33a79c46ee06a03d61fd4f10:
  file: img/temple-night-1600.webp
  srcset: [img/temple-night-900.webp 900w, img/temple-night-1600.webp 1600w]
  sizes: "100vw"
  loading: eager
d776a5cb02ae53fee7a4eb6fe8cf9ace: {file: img/newton-night-1536.webp, loading: lazy}
