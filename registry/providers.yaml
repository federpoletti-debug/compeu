# Provider registry: who each provider is and who controls it.
#
# The sovereignty status is NOT written here. It is computed by
# `compeu.registry.classify` from the facts below and the rule in
# registry/rules/. To change a status, change a fact (with evidence) or write a
# new rule version; never type a status by hand.
#
# Facts marked `contested: true` make the rule return "under_review".
# `confidence: provisional` means the fact comes from public information that has
# not yet been checked against a company register; such providers are shown with
# a "provisional" badge.
#
# Sites are the provider's published regions, placed at city level. They draw
# the map; they are not used to decide sovereignty.

providers:

