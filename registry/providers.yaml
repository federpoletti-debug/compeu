    name: Scaleway
    website: https://www.scaleway.com
    legal_entity: { name: Scaleway SAS, country: FR, city: Paris }
    ultimate_controller:
      name: Iliad Group (controlled by Xavier Niel)
      country: FR
      extraterritorial_law: false
    hq: { city: Paris, lat: 48.8722, lon: 2.3229 }
    sites:
      - { id: fr-par, city: Paris, country: FR, lat: 48.8566, lon: 2.3522 }
