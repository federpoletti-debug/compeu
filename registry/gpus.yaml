  - { id: gtx-1060, label: GTX 1060, vendor: NVIDIA, arch: Pascal, memory_gb: 6, tier: consumer, match: ['gtx ?1060'] }

# Form factor / interconnect variant, detected separately from the model.
variants:
  - { id: sxm, match: ['sxm', 'hgx', 'nvlink'] }
  - { id: nvl, match: ['\bnvl\b'] }
  - { id: pcie, match: ['pcie'] }
