  - { id: rtx-5090, label: RTX 5090, vendor: NVIDIA, arch: Blackwell, memory_gb: 32, tier: consumer, match: ['rtx ?5090'] }
  - { id: rtx-5080, label: RTX 5080, vendor: NVIDIA, arch: Blackwell, memory_gb: 16, tier: consumer, match: ['rtx ?5080'] }
  - { id: rtx-4090, label: RTX 4090, vendor: NVIDIA, arch: Ada Lovelace, memory_gb: 24, tier: consumer, match: ['rtx ?4090'] }
  - { id: rtx-4080, label: RTX 4080, vendor: NVIDIA, arch: Ada Lovelace, memory_gb: 16, tier: consumer, match: ['rtx ?4080'] }
  - { id: rtx-4070ti, label: RTX 4070 Ti, vendor: NVIDIA, arch: Ada Lovelace, memory_gb: 12, tier: consumer, match: ['rtx ?4070 ?ti'] }
  - { id: rtx-3090, label: RTX 3090, vendor: NVIDIA, arch: Ampere, memory_gb: 24, tier: consumer, match: ['rtx ?3090'] }
  - { id: rtx-3080ti, label: RTX 3080 Ti, vendor: NVIDIA, arch: Ampere, memory_gb: 12, tier: consumer, match: ['3080 ?ti'] }
